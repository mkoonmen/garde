# XcodeGen spec. The .xcodeproj is generated from this file (it's not committed),
# so any AI or person can edit the project in plain text.
name: Garde
options:
  bundleIdPrefix: com.michaelkoonmen
  deploymentTarget:
    iOS: "26.0"
packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.3
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
settings:
  base:
    SWIFT_VERSION: "5.0"   # Swift 6 language mode can be turned on later
    SWIFT_ENABLE_BARE_SLASH_REGEX: YES   # /regex/ literals are used throughout
    MARKETING_VERSION: "2.9.5"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
targets:
  Garde:
    type: application
    platform: iOS
    sources: [Garde, Shared]
    dependencies:
      - target: GardeWidget
      - target: GardeShare
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: MLXSwiftLM
        product: MLXFoundationModels
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    info:
      path: Garde/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        GardeGoogleClientID: 956562639556-22sq6kbra3d2p7ami7g8n8lpejapoa8c.apps.googleusercontent.com   # public sign-in ID (Google Cloud project garde-513820)
        UIBackgroundModes: [remote-notification]
        NSUbiquitousContainers:
          iCloud.com.michaelkoonmen.garde:
            NSUbiquitousContainerIsDocumentScopePublic: false
            NSUbiquitousContainerName: Garde
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: Garde/Garde.entitlements
      properties:
        com.apple.security.application-groups: [group.com.michaelkoonmen.garde]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.michaelkoonmen.garde]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.michaelkoonmen.garde]
        com.apple.developer.icloud-services: [CloudKit, CloudDocuments]
        aps-environment: development
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelkoonmen.garde
        PRODUCT_NAME: Garde
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Garde
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan receipts, barcodes, groceries and food labels."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Pick photos of receipts and food to scan."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Hands-free cook mode listens for “next”, “back” and “start timer”."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Understands cook-mode voice commands on this iPhone."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GardeWidget:
    type: app-extension
    platform: iOS
    sources: [GardeWidget, Shared]
    entitlements:
      path: GardeWidget/GardeWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.michaelkoonmen.garde]
    info:
      path: GardeWidget/Info.plist
      properties:
        CFBundleDisplayName: Garde
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelkoonmen.garde.widget
        PRODUCT_NAME: GardeWidget
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  GardeShare:
    type: app-extension
    platform: iOS
    sources: [GardeShare, Shared]
    entitlements:
      path: GardeShare/GardeShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.michaelkoonmen.garde]
    info:
      path: GardeShare/Info.plist
      properties:
        CFBundleDisplayName: Garde
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelkoonmen.garde.share
        PRODUCT_NAME: GardeShare
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  GardeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GardeTests]
    dependencies:
      - target: Garde
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelkoonmen.garde.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Garde.app/Garde"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Garde:
    build:
      targets:
        Garde: all
        GardeWidget: all
        GardeShare: all
    test:
      targets: [GardeTests]
