name: Build & send to TestFlight

# Manual only for now: Garde is built and uploaded with Xcode on Michael's Mac (like his other apps).
# To use this instead, add the four secrets in the README and run it from the Actions tab.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Run tests (nothing ships if these fail)
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin)['devices']
          ios=[(tuple(map(int,re.findall(r'\d+',k.split('iOS-')[1]))),v) for k,v in d.items() if 'iOS-' in k]
          ios.sort(reverse=True)
          print(next(x['udid'] for _,v in ios for x in v if 'iPhone' in x['name']))")
          echo "Testing on simulator $SIM"
          xcodebuild test -project Garde.xcodeproj -scheme Garde -destination "id=$SIM" \
            CODE_SIGNING_ALLOWED=NO | tail -60
          exit ${PIPESTATUS[0]}

      - name: Install App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Archive
        run: |
          xcodebuild archive \
            -project Garde.xcodeproj -scheme Garde \
            -destination "generic/platform=iOS" \
            -archivePath build/Garde.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}

      - name: Export IPA
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$DEVELOPMENT_TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Garde.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app -f build/ipa/*.ipa -t ios \
            --apiKey ${{ secrets.ASC_KEY_ID }} --apiIssuer ${{ secrets.ASC_ISSUER_ID }}
